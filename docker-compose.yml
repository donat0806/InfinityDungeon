services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: infinitydungeon
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
    environment:
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION: Host=db;Port=5432;Database=infinitydungeon;Username=postgres
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  postgres_data:
