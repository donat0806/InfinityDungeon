name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build C++
        run: cmake --build build --config Release

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Restore server
        run: dotnet restore server/InfinityDungeon.Server.csproj

      - name: Build server
        run: dotnet build server/InfinityDungeon.Server.csproj --no-restore -c Release

      - name: Test server
        run: dotnet test server/tests/InfinityDungeon.Server.Tests.csproj -c Release
