name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game:
    name: Game (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install raylib dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release

  server:
    name: Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore server
        run: dotnet restore server/InfinityDungeon.Server.csproj

      - name: Build server
        run: dotnet build server/InfinityDungeon.Server.csproj --no-restore -c Release

      - name: Test server
        run: dotnet test server/tests/InfinityDungeon.Server.Tests.csproj -c Release
